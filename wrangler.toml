# Mother AI — one Worker owns the marketing site, control plane, gateway API,
# badge endpoints and static assets. Production must always correspond to a
# committed, pushed `main`; deploy with `npm run deploy` (scripts/deploy.mjs).

name = "mother-ai"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Canonical public host (config/site.json "origin"). workers.dev stays enabled as the
# operational fallback for gateway/API/badge traffic; human-facing pages redirect.
#
# The proptechusa.ai zone also carries wildcard routes for other products
# (`*proptechusa.ai/sitemap.xml`, `*proptechusa.ai/site-map`, `*proptechusa.ai/news/*`)
# that match every subdomain and take precedence over Custom Domains. The explicit
# host route below is more specific, so every path on mother.proptechusa.ai stays
# on this Worker without changing the other products' routes.
routes = [
  { pattern = "mother.proptechusa.ai", custom_domain = true },
  { pattern = "mother.proptechusa.ai/*", zone_name = "proptechusa.ai" },
]

[assets]
directory = "./dist/web"
binding = "ASSETS"
# Every request goes through the Worker so security headers, the SPA fallback
# for /app/* and route ownership are decided in one place.
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "mother-ai-prod"
database_id = "6269d02e-81bb-47ce-b64a-2843bcb190d1"
migrations_dir = "migrations"

# Workers Rate Limiting bindings. Counters are per Cloudflare location and
# eventually consistent — a coarse abuse control, not a billing meter.
[[ratelimits]]
name = "RL_GATEWAY_IP"
namespace_id = "4101"
simple = { limit = 1200, period = 60 }

[[ratelimits]]
name = "RL_GATEWAY_KEY"
namespace_id = "4102"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_DEMO"
namespace_id = "4103"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_FORMS"
namespace_id = "4104"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "4105"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_CONSOLE"
namespace_id = "4106"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RL_PUBLIC_BADGE"
namespace_id = "4107"
simple = { limit = 300, period = 60 }

[triggers]
# Sweeps expired approvals, sessions and auth challenges.
crons = ["*/10 * * * *"]

[vars]
ENVIRONMENT = "production"
# Turnstile keys are Worker secrets (TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY), not vars,
# so a deploy can never overwrite them. With neither set, Founding Access relies on rate
# limiting + honeypot + signed form timing; with both set, Turnstile is enforced.
# Set at deploy time by scripts/deploy.mjs (--var GIT_SHA:<sha>).
GIT_SHA = "dev"

[observability]
enabled = true
