# Mother AI — API Worker: gateway, passkey auth, control-plane API, public browser
# APIs (demo, Founding Access + Slack lead notifications), badge SVGs and cron. The public
# UI is served by Vercel. Production must always correspond to a committed, pushed `main`;
# deploy with `npm run deploy` (scripts/deploy.mjs).
#
# Secrets (npx wrangler secret put <NAME> --name mother-ai): FORM_SIGNING_KEY, SLACK_LEADS_WEBHOOK_URL.

name = "mother-ai"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# API hosts only. The public UI (mother.proptechusa.ai) is served by Vercel project
# `mother`; this Worker keeps workers.dev as an operational fallback.
#
# The proptechusa.ai zone carries wildcard routes for other products
# (`*proptechusa.ai/sitemap.xml`, `/site-map`, `/news/*`) that match every subdomain and
# outrank Custom Domains, so the API host is pinned with explicit host routes.
routes = [
  { pattern = "api.mother.proptechusa.ai", custom_domain = true },
  { pattern = "api.mother.proptechusa.ai/*", zone_name = "proptechusa.ai" },
  { pattern = "api.mother.proptechusa.ai/news/*", zone_name = "proptechusa.ai" },
]

[[d1_databases]]
binding = "DB"
database_name = "mother-ai-prod"
database_id = "6269d02e-81bb-47ce-b64a-2843bcb190d1"
migrations_dir = "migrations"

# Workers Rate Limiting bindings. Counters are per Cloudflare location and
# eventually consistent — a coarse abuse control, not a billing meter.
[[ratelimits]]
name = "RL_GATEWAY_IP"
namespace_id = "4101"
simple = { limit = 1200, period = 60 }

[[ratelimits]]
name = "RL_GATEWAY_KEY"
namespace_id = "4102"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "RL_DEMO"
namespace_id = "4103"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_FORMS"
namespace_id = "4104"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "4105"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_CONSOLE"
namespace_id = "4106"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RL_PUBLIC_BADGE"
namespace_id = "4107"
simple = { limit = 300, period = 60 }

[triggers]
# Sweeps expired approvals, sessions and auth challenges.
crons = ["*/10 * * * *"]

[vars]
ENVIRONMENT = "production"
# Set at deploy time by scripts/deploy.mjs (--var GIT_SHA:<sha>).
GIT_SHA = "dev"

[observability]
enabled = true
